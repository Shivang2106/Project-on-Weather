<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="StyleSheet" href="weather.css">
</head>
<body>
    <div class="body">
        <div class="location">
            <span id="my-location">
                <p id="loc">My-Location</p>
                <p id="area">Noida</p>
                <p id="temp-area">67°C</p>
                <p id="Sun-cloud">Sunny</p>
            </span>
        </div>
    </div>
    <div class="Climate-for-day">
        <p>Sunny condition will continue all day. Wind gusts are up to 6mph.</p>
        <hr> 
        <div class="for-day">
            <div class="per-hour">
                <p>Now</p>
                <img src="sun.png">

            </div>
            <div class="per-hour">
                <p>10AM</p>
                <img src="sun.png">
                <p>35°C</p>
            </div>
            <div class="per-hour">
                <p>11AM</p>
                <img src="sun.png">
                <p>37°C</p>
            </div>
            <div class="per-hour">
                <p>12PM</p>
                <img src="sun.png">
                <p>40°C</p>
            </div>
            <div class="per-hour">
                <p>1PM</p>
                <img src="sun.png">
                <p>39°C</p>
            </div>
            <div class="per-hour">
                <p>2PM</p>
                <img src="sun.png">
                <p>41°C</p>
            </div>
            <div class="per-hour">
                <p>3PM</p>
                <img src="sun.png">
                <p>43°C</p>
            </div>
            <div class="per-hour">
                <p>4PM</p>

                <p>38°C</p>
            </div>
            <div class="per-hour">
                <p>5PM</p>
                <img src="sun.png">
                <p>35°C</p>
            </div>
            <div class="per-hour">
                <p>6PM</p>
                <img src="sun.png">
                <p>35°C</p>
            </div>
            <div class="per-hour">
                <p>6:30PM</p>

            </div>
            <div class="per-hour">
                <p>8PM</p>
                <img src="sun.png">
                <p>30°C</p>
            </div>
            <div class="per-hour">
                <p>9PM</p>
                <img src="sun.png">
                <p>29°C</p>
            </div>
            <div class="per-hour">
